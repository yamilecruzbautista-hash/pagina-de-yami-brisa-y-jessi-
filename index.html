<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Menú Principal</title>
    <style>
        :root {
            --bg-main: #f0f8ff;
            --header-bg: #d4e6f1;
            --card-bg: #eaf2f8;
            --card-border: #a9cce3;
            --text-primary: #1b4f72;
            --text-secondary: #2874a6;
            --nav-btn: #5499c7;
            --nav-btn-hover: #2980b9;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: var(--header-bg);
            padding: 25px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }
        .menu {
            text-align: center;
            margin: 30px 0;
        }
        .nav-btn {
            background-color: var(--nav-btn);
            color: white;
            padding: 12px 20px;
            margin: 8px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }
        .nav-btn:hover {
            background-color: var(--nav-btn-hover);
        }
    </style>
</head>
<body>
    <header>
        <h1>Página Principal - Menú de Navegación</h1>
        <p>Haz clic en los botones para ir a páginas diferentes</p>
    </header>

    <div class="menu">
        <a href="html.html" class="nav-btn">Módulo HTML</a>
        <a href="mysql.html" class="nav-btn">Módulo MySQL</a>
        <a href="diagramas.html" class="nav-btn">Diagramas E-R</a>
    </div>
</body>
</html>
